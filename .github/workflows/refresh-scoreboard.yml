name: Refresh scoreboard cache

on:
  schedule:
    # Exact America/Chicago refresh windows, expressed in UTC. These entries cover
    # both CDT (summer) and CST (winter) offsets so the job is triggered at the
    # intended Central times without relying on a broad hourly sweep.
    - cron: "0 5 * * 3"   # Wed 00:00 CT (CDT)
    - cron: "0 2 * * 4"   # Thu 21:00 CT (CDT)
    - cron: "0 6 * * 5"   # Fri 01:00 CT (CDT)
    - cron: "30 19 * * 6" # Sat 14:30 CT (CDT)
    - cron: "30 23 * * 6" # Sat 18:30 CT (CDT)
    - cron: "0 4 * * 0"   # Sat 23:00 CT (CDT)
    - cron: "0 8 * * 0"   # Sun 03:00 CT (CDT)
    - cron: "0 6 * * 3"   # Wed 00:00 CT (CST)
    - cron: "0 3 * * 4"   # Thu 21:00 CT (CST)
    - cron: "0 7 * * 5"   # Fri 01:00 CT (CST)
    - cron: "30 20 * * 6" # Sat 14:30 CT (CST)
    - cron: "30 0 * * 0"  # Sat 18:30 CT (CST)
    - cron: "0 5 * * 0"   # Sat 23:00 CT (CST)
    - cron: "0 9 * * 0"   # Sun 03:00 CT (CST)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-scoreboard-cache
  cancel-in-progress: false

jobs:
  refresh-scoreboard:
    runs-on: ubuntu-latest
    env:
      SCOREBOARD_SEASON: 2026
      CFDB_API_KEY: ${{ secrets.CFDB_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check refresh window
        id: refresh-window
        run: node scripts/check-scoreboard-refresh-window.js

      - name: Validate CFDB secret
        if: github.event_name == 'workflow_dispatch' || steps.refresh-window.outputs.should_refresh == 'true'
        run: |
          if [ -z "$CFDB_API_KEY" ]; then
            echo "CFDB_API_KEY GitHub secret is required for scoreboard refreshes." >&2
            exit 1
          fi

      - name: Refresh scoreboard cache
        if: github.event_name == 'workflow_dispatch' || steps.refresh-window.outputs.should_refresh == 'true'
        run: npm run refresh:scoreboard-cache -- "$SCOREBOARD_SEASON"

      - name: Commit refreshed scoreboard cache
        if: github.event_name == 'workflow_dispatch' || steps.refresh-window.outputs.should_refresh == 'true'
        run: |
          if git diff --quiet -- data/scoreboard; then
            echo "No scoreboard cache changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scoreboard
          git commit -m "Refresh 2026 scoreboard cache" -m "Automated scoreboard refresh run for the 2026 season." -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push origin HEAD:${{ github.ref_name }}

      - name: Trigger Vercel deployment
        if: github.event_name == 'workflow_dispatch' || steps.refresh-window.outputs.should_refresh == 'true'
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL not configured; skipping Vercel redeploy."
            exit 0
          fi

          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"
